services:
  server:
    build:
      context: ./server/
      dockerfile: Dockerfile
    container_name: express-backend
    ports:
      - "3000:3000"
    volumes:
      - ./server:/server
      - /server/node_modules

  client:
    build:
      context: ./client/
      dockerfile: Dockerfile
    container_name: react-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./client:/client
      - /client/node_modules

